<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your inbox — AnonXyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<style>
  /* ===== Messenger-style additions (kept separate from style.css) ===== */
  .msgr{ display:flex; gap:16px; align-items:flex-start; }
  .thread-list{ width:280px; flex-shrink:0; }
  .thread-item{
    display:flex; flex-direction:column; gap:2px;
    padding:12px 14px; border-radius:12px; cursor:pointer;
    border:1px solid transparent; margin-bottom:6px;
  }
  .thread-item:hover{ background:rgba(255,255,255,0.04); }
  .thread-item.active{ border-color: currentColor; background:rgba(255,255,255,0.06); }
  .thread-item .t-top{ display:flex; justify-content:space-between; gap:8px; }
  .thread-item .t-name{ font-weight:600; font-size:13.5px; }
  .thread-item .t-time{ font-size:11px; opacity:0.6; white-space:nowrap; }
  .thread-item .t-preview{
    font-size:12.5px; opacity:0.75;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .thread-panel{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .thread-scroll{
    flex:1; min-height:300px; max-height:60vh; overflow-y:auto;
    display:flex; flex-direction:column; gap:8px; padding:10px 4px;
  }
  .msg-row{ display:flex; }
  .msg-row.mine{ justify-content:flex-end; }
  .msg-row.theirs{ justify-content:flex-start; }
  .msg-bubble{
    max-width:70%; padding:9px 13px; border-radius:14px;
    font-size:14px; line-height:1.4; white-space:pre-wrap; word-wrap:break-word;
  }
  .msg-row.theirs .msg-bubble{ background:rgba(255,255,255,0.06); border-bottom-left-radius:4px; }
  .msg-row.mine .msg-bubble{ background:#e8a020; color:#0d1b3e; font-weight:500; border-bottom-right-radius:4px; }
  .msg-time{ font-size:10px; opacity:0.55; margin-top:3px; display:block; }
  .thread-composer{ display:flex; gap:8px; margin-top:10px; }
  .thread-composer textarea{
    flex:1; resize:none; min-height:42px; max-height:110px;
    border-radius:10px; padding:10px 12px; font-family:inherit; font-size:14px;
  }
  .no-thread-selected{ opacity:0.6; font-size:13.5px; padding:30px 10px; text-align:center; }
  @media (max-width: 720px){
    .msgr{ flex-direction:column; }
    .thread-list{ width:100%; }
    .thread-panel{ display:none; }
    .thread-panel.open{ display:flex; }
    .thread-list.hidden-mobile{ display:none; }
    .back-to-list{ display:inline-block; margin-bottom:8px; cursor:pointer; font-size:13px; }
  }
  .back-to-list{ display:none; }
</style>
</head>
<body>
<div class="emoji-bg" aria-hidden="true">
  <span style="left:5%; animation-duration:14s; animation-delay:0s;">😄</span>
  <span style="left:15%; animation-duration:18s; animation-delay:2s;">😂</span>
  <span style="left:25%; animation-duration:12s; animation-delay:4s;">😊</span>
  <span style="left:35%; animation-duration:16s; animation-delay:1s;">⚡</span>
  <span style="left:45%; animation-duration:20s; animation-delay:3s;">😌</span>
  <span style="left:55%; animation-duration:13s; animation-delay:5s;">😅</span>
  <span style="left:65%; animation-duration:17s; animation-delay:2.5s;">😴</span>
  <span style="left:75%; animation-duration:15s; animation-delay:0.5s;">😉</span>
  <span style="left:85%; animation-duration:19s; animation-delay:3.5s;">😎</span>
  <span style="left:10%; animation-duration:22s; animation-delay:6s;">😍</span>
  <span style="left:30%; animation-duration:14s; animation-delay:7s;">😜</span>
  <span style="left:50%; animation-duration:18s; animation-delay:8s;">🥰</span>
  <span style="left:70%; animation-duration:16s; animation-delay:9s;">😢</span>
  <span style="left:90%; animation-duration:21s; animation-delay:5.5s;">🥰</span>
</div>
<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="index.html" class="header-logo">NGL's</a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
    </button>
  </div>
  <nav class="header-menu" id="headerMenu">
    <a href="https://tmenshs.github.io/AnonApp/send.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      Send a message
    </a>
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Create your link
    </a>
  </nav>
</header>

<div class="wrap">
  <div class="brand">
    <div class="mark">NGL's</div>
    <h1>Your inbox</h1>
  </div>
  <div class="card" id="loggedOutCard" style="display:none;">
    <p class="subtitle">Log in to see your messages.</p>
    <button onclick="window.location.href='login.html?redirect=inbox.html'">Log in</button>
  </div>
  <div id="loggedInView" style="display:none;">
    <div class="card">
      <div class="link-row">
        <input id="linkOutput" type="text" readonly>
        <button id="copyBtn" class="secondary">Copy link</button>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="msgr">
        <div class="thread-list" id="threadList">
          <div class="empty-state">Loading your conversations...</div>
        </div>
        <div class="thread-panel" id="threadPanel">
          <div class="no-thread-selected">Select a conversation to view it.</div>
        </div>
      </div>
    </div>
    <div class="footer-links">
      <a href="#" id="logoutLink">Log out</a>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script>
const menuToggle = document.getElementById('menuToggle');
const headerMenu = document.getElementById('headerMenu');
menuToggle.addEventListener('click', () => {
  menuToggle.classList.toggle('open');
  headerMenu.classList.toggle('open');
});

const session = getSession();
if (!session) {
  document.getElementById('loggedOutCard').style.display = 'block';
} else {
  document.getElementById('loggedInView').style.display = 'block';
  const personalLink = window.location.origin + window.location.pathname.replace('inbox.html', '') + 'send.html?to=' + session.userId;
  document.getElementById('linkOutput').value = personalLink;
  document.getElementById('copyBtn').addEventListener('click', () => {
    const input = document.getElementById('linkOutput');
    input.select();
    navigator.clipboard.writeText(input.value);
    const btn = document.getElementById('copyBtn');
    const original = btn.textContent;
    btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = original, 1500);
  });
  document.getElementById('logoutLink').addEventListener('click', (e) => {
    e.preventDefault();
    clearSession();
    window.location.href = 'login.html';
  });

  let openThreadId = null;
  let threadsByLatest = []; // [{threadId, preview, createdAt}], newest first

  // ===== Conversation list (grouped by threadId) =====
  async function loadThreadList() {
    const listEl = document.getElementById('threadList');
    try {
      const result = await callApi({ action: 'inbox', userId: session.userId });
      if (!result.success) {
        listEl.innerHTML = '<div class="empty-state">Could not load your inbox.</div>';
        return;
      }
      if (result.messages.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No messages yet. Share your link to start receiving anonymous messages.</div>';
        return;
      }

      // Inbox is already newest-first, so the first message we see per
      // threadId is that thread's latest preview.
      const seen = new Set();
      threadsByLatest = [];
      result.messages.forEach(m => {
        if (!seen.has(m.threadId)) {
          seen.add(m.threadId);
          threadsByLatest.push({ threadId: m.threadId, preview: m.content, createdAt: m.createdAt });
        }
      });

      renderThreadList();
    } catch (err) {
      listEl.innerHTML = '<div class="empty-state">Could not reach the server.</div>';
    }
  }

  function renderThreadList() {
    const listEl = document.getElementById('threadList');
    listEl.innerHTML = threadsByLatest.map(t => `
      <div class="thread-item ${t.threadId === openThreadId ? 'active' : ''}" data-thread-id="${t.threadId}">
        <div class="t-top">
          <span class="t-name">Conversation</span>
          <span class="t-time">${formatDate(t.createdAt)}</span>
        </div>
        <div class="t-preview">${escapeHtml(t.preview)}</div>
      </div>
    `).join('');

    listEl.querySelectorAll('.thread-item').forEach(el => {
      el.addEventListener('click', () => openThread(el.getAttribute('data-thread-id')));
    });
  }

  // ===== Full conversation view =====
  async function openThread(threadId) {
    openThreadId = threadId;
    renderThreadList(); // refresh active highlight
    document.getElementById('threadPanel').classList.add('open');

    const panel = document.getElementById('threadPanel');
    panel.innerHTML = '<div class="no-thread-selected">Loading conversation...</div>';

    try {
      const result = await callApi({ action: 'thread', userId: session.userId, threadId: threadId });
      if (!result.success) {
        panel.innerHTML = '<div class="no-thread-selected">Could not load this conversation.</div>';
        return;
      }
      renderThreadPanel(result.messages);
    } catch (err) {
      panel.innerHTML = '<div class="no-thread-selected">Could not reach the server.</div>';
    }
  }

  function renderThreadPanel(messages) {
    const panel = document.getElementById('threadPanel');
    const lastMessage = messages[messages.length - 1];

    panel.innerHTML = `
      <div class="back-to-list" id="backToList">&larr; Back to conversations</div>
      <div class="thread-scroll" id="threadScroll">
        ${messages.map(m => `
          <div class="msg-row ${m.isMine ? 'mine' : 'theirs'}">
            <div class="msg-bubble">
              ${escapeHtml(m.content)}
              <span class="msg-time">${formatDate(m.createdAt)}</span>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="thread-composer">
        <textarea id="threadReplyInput" placeholder="Write a reply..." maxlength="500"></textarea>
        <button id="threadReplyBtn" class="secondary">Reply</button>
      </div>
      <div class="reply-status" id="threadReplyStatus"></div>
    `;

    const scrollEl = document.getElementById('threadScroll');
    scrollEl.scrollTop = scrollEl.scrollHeight;

    document.getElementById('backToList').addEventListener('click', () => {
      document.getElementById('threadPanel').classList.remove('open');
    });

    document.getElementById('threadReplyBtn').addEventListener('click', async () => {
      const input = document.getElementById('threadReplyInput');
      const status = document.getElementById('threadReplyStatus');
      const btn = document.getElementById('threadReplyBtn');
      const content = input.value.trim();
      if (!content) {
        status.textContent = 'Write something before sending.';
        status.className = 'reply-status show err';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        const result = await callApi({
          action: 'reply',
          userId: session.userId,
          messageId: lastMessage.id,
          content: content
        });
        if (result.success) {
          messages.push({
            id: result.messageId,
            content: content,
            createdAt: new Date().toISOString(),
            parentId: lastMessage.id,
            isMine: true
          });
          renderThreadPanel(messages);
          loadThreadList(); // refresh preview text in the sidebar
        } else {
          status.textContent = result.message || 'Could not send reply.';
          status.className = 'reply-status show err';
          btn.disabled = false;
          btn.textContent = 'Reply';
        }
      } catch (err) {
        status.textContent = 'Could not reach the server.';
        status.className = 'reply-status show err';
        btn.disabled = false;
        btn.textContent = 'Reply';
      }
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function formatDate(raw) {
    try {
      const d = new Date(raw);
      return d.toLocaleString();
    } catch (e) {
      return '';
    }
  }

  loadThreadList();
  setInterval(() => {
    loadThreadList();
    if (openThreadId) openThread(openThreadId);
  }, 10000);
}
</script>
</body>
</html>
