<html lang="en">
<head>

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

</head>
<body>
<div class="emoji-bg" aria-hidden="true">

  <span style="left:15%; animation-duration:18s; animation-delay:2s;">😂</span>

  <span style="left:35%; animation-duration:16s; animation-delay:1s;">⚡</span>
  <span style="left:45%; animation-duration:20s; animation-delay:3s;">😌</span>
  <span style="left:55%; animation-duration:13s; animation-delay:5s;">😅</span>
  <span style="left:65%; animation-duration:17s; animation-delay:2.5s;">😴</span>
  <span style="left:75%; animation-duration:15s; animation-delay:0.5s;">😉</span>
  <span style="left:85%; animation-duration:19s; animation-delay:3.5s;">😎</span>
  <span style="left:10%; animation-duration:22s; animation-delay:6s;">😍</span>
  <span style="left:30%; animation-duration:14s; animation-delay:7s;">😜</span>
  <span style="left:50%; animation-duration:18s; animation-delay:8s;">🥰</span>

  <span style="left:90%; animation-duration:21s; animation-delay:5.5s;">🥰</span>
</div>
<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="index.html" class="header-logo">NGL's</a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
    </button>
  </div>
  <nav class="header-menu" id="headerMenu">
    <a href="https://tmenshs.github.io/AnonApp/send.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      Send a message
    </a>
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Create your link
    </a>
  </nav>
</header>

<div class="wrap">
  <div class="brand">
    <div class="mark">NGL's</div>
    <h1>Your inbox</h1>
  </div>
  <div class="card" id="loggedOutCard" style="display:none;">
    <p class="subtitle">Log in to see your messages.</p>
    <button onclick="window.location.href='login.html?redirect=inbox.html'">Log in</button>
  </div>
  <div id="loggedInView" style="display:none;">
    <div class="card">
      <div class="link-row">
        <input id="linkOutput" type="text" readonly>
        <button id="copyBtn" class="secondary">Copy link</button>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div id="inboxList" class="inbox-list">
        <div class="empty-state">Loading your messages...</div>
      </div>
    </div>
    <div class="footer-links">
      <a href="#" id="logoutLink">Log out</a>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script>
const menuToggle = document.getElementById('menuToggle');
const headerMenu = document.getElementById('headerMenu');
menuToggle.addEventListener('click', () => {
  menuToggle.classList.toggle('open');
  headerMenu.classList.toggle('open');
});

const session = getSession();
if (!session) {
  document.getElementById('loggedOutCard').style.display = 'block';
} else {
  document.getElementById('loggedInView').style.display = 'block';
  const personalLink = window.location.origin + window.location.pathname.replace('inbox.html', '') + 'send.html?to=' + session.userId;
  document.getElementById('linkOutput').value = personalLink;
  document.getElementById('copyBtn').addEventListener('click', () => {
    const input = document.getElementById('linkOutput');
    input.select();
    navigator.clipboard.writeText(input.value);
    const btn = document.getElementById('copyBtn');
    const original = btn.textContent;
    btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = original, 1500);
  });
  document.getElementById('logoutLink').addEventListener('click', (e) => {
    e.preventDefault();
    clearSession();
    window.location.href = 'login.html';
  });

  // ---- Conversation-grouped data layer -------------------------------
  // conversations: threadId -> { threadId, messages: [...] }
  // messages: everything in the thread, incoming + your own replies,
  // each with { id, direction: 'in'|'out', content, createdAt }
  let conversations = new Map();
  let draftText = new Map();      // threadId -> whatever the user is mid-typing
  let renderedIds = new Map();    // threadId -> Set of message ids currently in the DOM
  let activeRequest = 0;          // guards against overlapping loadInbox/poll races

  // A conversation's "last activity" is the newest timestamp among ALL its
  // messages (incoming AND your own replies) — not just the newest incoming
  // one. Otherwise a thread you just replied to (and are waiting on) would
  // look stale and sink below threads that haven't been touched.
  function lastActivityOf(conv) {
    return conv.messages.reduce((max, m) => {
      const t = new Date(m.createdAt).getTime();
      return t > max ? t : max;
    }, 0);
  }

  function sortedThreadIds() {
    return [...conversations.values()]
      .sort((a, b) => lastActivityOf(b) - lastActivityOf(a))
      .map(c => c.threadId);
  }

  async function loadInbox() {
    const listEl = document.getElementById('inboxList');
    const requestId = ++activeRequest;
    try {
      const summary = await callApi({ action: 'inbox', userId: session.userId });
      if (requestId !== activeRequest) return; // a newer load superseded this one

      if (!summary.success) {
        listEl.innerHTML = '<div class="empty-state">Could not load your inbox.</div>';
        return;
      }
      if (summary.messages.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No messages yet. Share your link to start receiving anonymous messages.</div>';
        return;
      }

      const threadIds = [...new Set(summary.messages.map(m => m.threadId))];

      // Pull each conversation's full, authoritative history (all incoming
      // messages + all replies) fresh from the server — never rely on
      // anything held only in memory, so a reload can never lose a reply.
      await Promise.all(threadIds.map(id => refreshThread(id)));
      if (requestId !== activeRequest) return;

      renderAll();
    } catch (err) {
      listEl.innerHTML = '<div class="empty-state">Could not reach the server.</div>';
    }
  }

  async function refreshThread(threadId) {
    try {
      const result = await callApi({ action: 'getThread', userId: session.userId, threadId });
      if (result.success) {
        conversations.set(threadId, { threadId, messages: result.messages });
      }
    } catch (err) {
      // keep whatever was cached for this thread, if anything
    }
  }

  // Poll: refresh every known thread's data, plus pick up any brand-new
  // threads, then re-render — but never stomp a draft the user is typing.
  async function pollInbox() {
    const requestId = ++activeRequest;
    try {
      const summary = await callApi({ action: 'inbox', userId: session.userId });
      if (requestId !== activeRequest || !summary.success) return;

      const threadIds = [...new Set(summary.messages.map(m => m.threadId))];
      await Promise.all(threadIds.map(id => refreshThread(id)));
      if (requestId !== activeRequest) return;

      renderAll();
    } catch (err) {
      // silent fail — just try again next tick
    }
  }

  function renderAll() {
    const listEl = document.getElementById('inboxList');
    const ids = sortedThreadIds();

    // Save whatever's currently typed in each open reply box before we
    // blow away the DOM, so re-rendering never wipes an in-progress draft.
    document.querySelectorAll('.reply-input').forEach(input => {
      const tid = input.closest('.reply-form').getAttribute('data-thread-id');
      draftText.set(tid, input.value);
    });

    listEl.innerHTML = ids.map(id => renderConversationBubble(conversations.get(id))).join('');
    attachReplyHandlers();

    // Restore drafts.
    document.querySelectorAll('.reply-input').forEach(input => {
      const tid = input.closest('.reply-form').getAttribute('data-thread-id');
      if (draftText.has(tid)) input.value = draftText.get(tid);
    });
  }

  // One bubble per conversation. Shows the original message, then every
  // reply exchanged so far (fetched fresh from the server, so it survives
  // reloads), then a single reply box that always targets this thread's
  // latest message.
  function renderConversationBubble(conv) {
    const messages = [...conv.messages].sort(
      (a, b) => new Date(a.createdAt) - new Date(b.createdAt)
    );
    const original = messages.find(m => m.direction === 'in') || messages[0];
    const replies = messages.filter(m => m.id !== original.id);
    const lastMessage = messages[messages.length - 1];

    return `
      <div class="bubble" data-thread-id="${conv.threadId}">
        ${escapeHtml(original.content)}
        <span class="time">${formatDate(original.createdAt)}</span>

        <div class="sent-replies">
          ${replies.map(m => `
            <div class="reply-block">
              <span class="reply-label">${m.direction === 'out' ? 'You replied' : 'They replied'}</span>
              <div class="reply-text">${escapeHtml(m.content)}</div>
            </div>
          `).join('')}
        </div>

        <div class="reply-form" data-thread-id="${conv.threadId}" data-reply-to="${lastMessage.id}">
          <textarea class="reply-input" placeholder="Write a reply..." maxlength="500"></textarea>
          <button class="reply-btn secondary">Reply</button>
          <div class="reply-status"></div>
        </div>
      </div>
    `;
  }

  function attachReplyHandlers() {
    document.querySelectorAll('.reply-form:not([data-bound])').forEach(form => {
      form.setAttribute('data-bound', 'true');
      const threadId = form.getAttribute('data-thread-id');
      const btn = form.querySelector('.reply-btn');
      const input = form.querySelector('.reply-input');
      const status = form.querySelector('.reply-status');

      btn.addEventListener('click', async () => {
        // Always target this thread's actual latest message, read fresh
        // off the form's own data attribute at click time — never a value
        // captured earlier that could have gone stale.
        const messageId = form.getAttribute('data-reply-to');
        const content = input.value.trim();
        if (!content) {
          status.textContent = 'Write something before sending.';
          status.className = 'reply-status show err';
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Sending...';
        try {
          const result = await callApi({
            action: 'reply',
            userId: session.userId,
            messageId: messageId,
            content: content
          });
          if (result.success) {
            draftText.delete(threadId);
            input.value = '';
            status.textContent = 'Reply sent.';
            status.className = 'reply-status show ok';
            btn.disabled = false;
            btn.textContent = 'Reply';
            // Re-pull this thread from the server so the new reply, and
            // its updated "last activity" ranking, are both authoritative.
            await refreshThread(threadId);
            renderAll();
          } else {
            status.textContent = result.message || 'Could not send reply.';
            status.className = 'reply-status show err';
            btn.disabled = false;
            btn.textContent = 'Reply';
          }
        } catch (err) {
          status.textContent = 'Could not reach the server.';
          status.className = 'reply-status show err';
          btn.disabled = false;
          btn.textContent = 'Reply';
        }
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function formatDate(raw) {
    try {
      const d = new Date(raw);
      return d.toLocaleString();
    } catch (e) {
      return '';
    }
  }

  loadInbox();
  setInterval(pollInbox, 10000);
}
</script>
</body>
</html>
